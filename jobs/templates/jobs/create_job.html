{% extends "base.html" %}

{% block title %}
    Post a Job - JobPortal
{% endblock %}


{% block content %}

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card border-0 shadow-sm">

                    <div class="card-body p-4">

                        <h2 class="fw-bold mb-2">
                            Post a New Job
                        </h2>

                        <p class="text-muted mb-4">
                            Find the right candidate for your company.
                        </p>

                        <form method="POST">

                            {% csrf_token %}

                            {{ form.as_p }}

                            <div class="mt-4">

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    Post Job
                                </button>

                                <a
                                    href="{% url 'recruiter_dashboard' %}"
                                    class="btn btn-outline-secondary"
                                >
                                    Cancel
                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
