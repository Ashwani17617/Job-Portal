{% extends "base.html" %}

{% block title %}
    Apply - {{ job.title }}
{% endblock %}


{% block content %}

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="card border-0 shadow-sm">

                    <div class="card-body p-4">

                        <h2 class="fw-bold">
                            Apply for {{ job.title }}
                        </h2>

                        <p class="text-muted">
                            {{ job.company.name }}
                        </p>

                        <hr>

                        <form
                            method="POST"
                            enctype="multipart/form-data"
                        >

                            {% csrf_token %}

                            {{ form.as_p }}

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Submit Application
                            </button>

                            <a
                                href="{% url 'job_detail' job.id %}"
                                class="btn btn-outline-secondary"
                            >
                                Cancel
                            </a>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
