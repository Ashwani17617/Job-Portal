{% extends "base.html" %}

{% block title %}
    Already Applied
{% endblock %}


{% block content %}

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-6">

                <div class="alert alert-info text-center">

                    <h4 class="alert-heading">
                        Already Applied
                    </h4>

                    <p>
                        You have already applied for
                        <strong>{{ job.title }}</strong>.
                    </p>

                    <a
                        href="{% url 'job_detail' job.id %}"
                        class="btn btn-primary"
                    >
                        Back to Job
                    </a>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
