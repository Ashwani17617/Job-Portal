{% extends "base.html" %}

{% block title %}
    Company Profile - JobPortal
{% endblock %}


{% block content %}

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card border-0 shadow-sm">

                    <div class="card-body p-4">

                        <h2 class="fw-bold">
                            Company Profile
                        </h2>

                        <p class="text-muted">
                            Update your company information
                            for potential candidates.
                        </p>

                        <hr>

                        <form
                            method="POST"
                            enctype="multipart/form-data"
                        >

                            {% csrf_token %}

                            {{ form.as_p }}

                            <div class="mt-4">

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    Save Company Profile
                                </button>

                                <a
                                    href="{% url 'recruiter_dashboard' %}"
                                    class="btn btn-outline-secondary"
                                >
                                    Cancel
                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
