{% extends "base.html" %}

{% block title %}
    My Profile - JobPortal
{% endblock %}


{% block content %}

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card border-0 shadow-sm">

                    <div class="card-body p-4">

                        <h2 class="fw-bold">
                            My Profile
                        </h2>

                        <p class="text-muted">
                            Keep your profile updated so recruiters
                            can learn more about you.
                        </p>

                        <hr>

                        <form
                            method="POST"
                            enctype="multipart/form-data"
                        >

                            {% csrf_token %}

                            {{ form.as_p }}

                            <div class="mt-4">

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    Save Profile
                                </button>

                                <a
                                    href="{% url 'candidate_dashboard' %}"
                                    class="btn btn-outline-secondary"
                                >
                                    Cancel
                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
