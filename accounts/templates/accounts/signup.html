{% extends "base.html" %}

{% block title %}
    Sign Up - JobPortal
{% endblock %}


{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <h1>Create Account</h1>

        <p class="auth-subtitle">
            Join JobPortal and find your next opportunity.
        </p>


        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit"
                    class="primary-button">
                Create Account
            </button>

        </form>


        <p class="auth-footer">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </p>

    </div>

</section>

{% endblock %}
