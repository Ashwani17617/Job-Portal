{% extends "base.html" %}

{% block title %}
    Login - JobPortal
{% endblock %}


{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Login to continue to JobPortal.
        </p>


        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit"
                    class="primary-button">
                Login
            </button>

        </form>


        <p class="auth-footer">

            Don't have an account?

            <a href="{% url 'signup' %}">
                Create Account
            </a>

        </p>

    </div>

</section>

{% endblock %}
