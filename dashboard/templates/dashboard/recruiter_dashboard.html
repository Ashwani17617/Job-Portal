{% extends "base.html" %}

{% block title %}
    Recruiter Dashboard - JobPortal
{% endblock %}


{% block content %}

<div class="container py-5">

    <h1 class="fw-bold">
        Recruiter Dashboard
    </h1>

    <p class="text-muted">
        Welcome, {{ user.first_name|default:user.username }}!
    </p>


    <div class="mt-4">
        <a
            href="{% url 'company_profile' %}"
            class="btn btn-outline-primary"
        >
            Company Profile
        </a>
        <a
            href="{% url 'create_job' %}"
            class="btn btn-primary"
        >
            Post a Job
        </a>
        <a
        href="{% url 'recruiter_jobs' %}"
        class="btn btn-outline-primary"
        >
            My Jobs
        </a>

    </div>

</div>

{% endblock %}
